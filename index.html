<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contas do Mês</title>
<meta name="description" content="Organize as contas a pagar pelo dia em que você recebe.">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="main-style">
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: faixa de resultado no topo, depois dois blocos lado a lado (o que sai do dinheiro do dia 05 e do dia 20), cartões e saldos embaixo */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#151a24; --muted:#5d6676; --line:#dfe3ea;
  --accent:#2747c9; --accent-soft:#e6ebfb;
  --good:#127a4b; --good-soft:#e1f3ea; --bad:#b4232e; --bad-soft:#fbe6e7; --warn:#9a5b00; --warn-soft:#fbefd9; --mark:#fde68a;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#171b24; --ink:#e8ebf1; --muted:#98a1b2; --line:#2a303c;
  --accent:#8ea2ff; --accent-soft:#1e2643;
  --good:#5fd39a; --good-soft:#15291f; --bad:#ff7b84; --bad-soft:#2f1619; --warn:#f2b64c; --warn-soft:#2c2212; --mark:#7a5d0c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#171b24; --ink:#e8ebf1; --muted:#98a1b2; --line:#2a303c;
  --accent:#8ea2ff; --accent-soft:#1e2643;
  --good:#5fd39a; --good-soft:#15291f; --bad:#ff7b84; --bad-soft:#2f1619; --warn:#f2b64c; --warn-soft:#2c2212; --mark:#7a5d0c; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
#app{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:grid;gap:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;padding:6px 8px;color:var(--muted)}
.btn.ghost:hover{color:var(--accent)}

/* topo */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.cycle{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--muted)}
.cycle input{min-width:0;font:inherit;color:var(--ink);background:transparent;border:1px dashed var(--line);border-radius:6px;padding:3px 8px;width:180px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* faixa de resultado */
.result{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.result>div{padding:14px 16px;display:grid;gap:4px;border-left:1px solid var(--line)}
.result>div:first-child{border-left:0}
.result .v{font-family:var(--f-num);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums}
.result .sub{font-size:12.5px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
@media (max-width:720px){.result{grid-template-columns:1fr 1fr}.result>div:nth-child(3){border-left:0}.result>div:nth-child(n+3){border-top:1px solid var(--line)}}

/* blocos de pagamento */
.days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:stretch}
@media (max-width:760px){.days{grid-template-columns:1fr}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.day>.list{flex:1 1 auto}
.day>.day-foot{margin-top:auto}
.day-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 16px 12px}
.day-head .big{font-family:var(--f-display);font-size:38px;font-weight:700;line-height:1;color:var(--accent)}
.income{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 16px;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
.income button{background:none;border:0;padding:0;text-align:left}
.list{list-style:none;margin:8px 0 0;padding:0}
.bill{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.bill:first-child{border-top:0}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.chk svg{width:13px;height:13px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.chk[aria-pressed="true"] svg{opacity:1}
.bill-main{min-width:0;background:none;border:0;padding:0;text-align:left;display:grid;gap:3px}
.bill-name{font-weight:600;overflow-wrap:anywhere}
.bill.paid .bill-name,.bill.paid .bill-val{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.late{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.est{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.bill-val{text-align:right}
.day-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);font-weight:600}
.day-foot .num{font-size:17px}
.day-foot .left{font-size:12.5px;color:var(--muted);font-weight:500}
.empty{padding:14px 16px;color:var(--muted);font-size:14px}

/* cartões e saldos */
.lower{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:stretch}
@media (max-width:760px){.lower{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;align-content:start}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-row{display:grid;gap:7px}
.card-row .line{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bar{height:8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar>i.hot{background:var(--bad)}
.small{font-size:12.5px;color:var(--muted)}
.rows{display:grid;gap:0}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.row:first-child{border-top:0}
.row button{background:none;border:0;padding:0;text-align:left;min-width:0}
.row.total{font-weight:600}
.group-label{margin-top:4px}

/* assinaturas */
.subs-list{list-style:none;margin:0;padding:0;display:grid}
.sub-row{border-top:1px solid var(--line)}
.sub-row:first-child{border-top:0}
.bar{display:flex}
.bar>i.future{background:var(--accent);opacity:.35;border-radius:0 999px 999px 0}
.bar>i+i{margin-left:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--accent);vertical-align:0}
.legend span.f::before{opacity:.35}
.sub-row button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:none;border:0;padding:10px 0;text-align:left}
.sub-name{font-weight:600;overflow-wrap:anywhere}
.sub-row .meta{grid-column:1/-1}
.chip.card{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.nocard{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* visão geral */
.ov-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:stretch}
@media (max-width:760px){.ov-grid{grid-template-columns:1fr}}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.verdict .dot{width:14px;height:14px;border-radius:50%;margin-top:6px}
.verdict p{margin:4px 0 0;color:var(--muted)}
.pill{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-good{background:var(--good-soft);color:var(--good)} .st-warn{background:var(--warn-soft);color:var(--warn)} .st-bad{background:var(--bad-soft);color:var(--bad)} .st-none{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.dot.st-good{background:var(--good)} .dot.st-warn{background:var(--warn)} .dot.st-bad{background:var(--bad)}
.kpi{display:grid;gap:2px}
.kpi .v{font-family:var(--f-num);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.ov-lines{display:grid}
.ov-lines .row span:first-child{color:var(--muted)}
.meter{display:grid;gap:6px}
.meter .bar{height:10px}
.meter .bar>i.good{background:var(--good)} .meter .bar>i.warn{background:var(--warn)} .meter .bar>i.bad{background:var(--bad)}
.meter .line{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tick-wrap{position:relative}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.ends{list-style:none;margin:0;padding:0;display:grid}
.ends li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ends li:first-child{border-top:0}
.disclaimer{font-size:12.5px;color:var(--muted)}

/* menu lateral */
.brand{display:flex;align-items:flex-start;gap:12px;min-width:0}
.menu-btn{width:42px;height:42px;flex:none;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0;margin-top:2px}
.menu-btn:hover{border-color:var(--accent)}
.menu-btn svg{width:20px;height:20px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.menu-btn .badge{position:absolute}
.drawer-ov{position:fixed;inset:0;background:rgb(10 12 18 / .4);z-index:30;opacity:0;pointer-events:none}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);z-index:31;background:var(--surface);border-right:1px solid var(--line);
  padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:6px;transform:translateX(-102%);overflow-y:auto}
.drawer.open{transform:none}
.drawer.open+.drawer-ov,.drawer-ov.open{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:no-preference){.drawer{transition:transform .22s ease}.drawer-ov{transition:opacity .22s ease}}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 6px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.drawer-head strong{font-family:var(--f-display);font-size:18px}
.nav-item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:11px 12px;font-weight:600;font-size:15px}
.nav-item:hover{background:var(--bg)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-item .count{font-family:var(--f-num);font-size:12px;font-weight:500;background:var(--bg);color:var(--muted);border-radius:999px;padding:1px 8px}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.nav-label{padding:4px 12px 0}

/* limites por categoria */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:stretch}
@media (max-width:760px){.cats{grid-template-columns:1fr}}
.cat-add{display:grid;grid-template-columns:minmax(0,7rem) minmax(0,1fr) auto;gap:8px}
.cat-add input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box;min-width:0}
.cat-big{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cat-big .v{font-family:var(--f-num);font-size:22px;font-variant-numeric:tabular-nums}
.gastos{list-style:none;margin:0;padding:0;display:grid}
.gastos li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.gastos li:first-child{border-top:0}
.gastos .x{background:none;border:0;color:var(--muted);padding:2px 6px;border-radius:6px;font-size:16px;line-height:1}
.gastos .x:hover{color:var(--bad);background:var(--bad-soft)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* notas */
.compose{display:grid;gap:10px}
.compose textarea,.field textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;box-sizing:border-box;min-height:84px;resize:vertical;line-height:1.45}
.compose-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
@media (max-width:560px){.compose-row{grid-template-columns:1fr 1fr}.compose-row>.btn{grid-column:1/-1}}
.compose select,.compose input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;box-sizing:border-box}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filter{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
@media (max-width:640px){.notes{grid-template-columns:1fr}}
.note-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.note-card.done{opacity:.62}
.note-card.done .note-text{text-decoration:line-through}
.note-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.note-text{overflow-wrap:anywhere;margin:0;flex:1 1 auto;line-height:1.5}
.note-text ul,.note-text ol,.rte-area ul,.rte-area ol{margin:.25em 0;padding-left:1.4em}
.note-text div,.rte-area div,.rte-area p{margin:0}
mark{background:var(--mark);color:inherit;padding:0 .12em;border-radius:3px}
/* editor de texto */
.rte{border:1px solid var(--line);border-radius:10px;background:var(--bg);display:grid}
.rte:focus-within{border-color:var(--accent)}
.rte-bar{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:10px 10px 0 0}
.rte-btn{min-width:36px;height:36px;border:0;background:transparent;border-radius:7px;display:grid;place-items:center;padding:0 8px;color:var(--ink);font-size:15px;line-height:1}
.rte-btn:hover{background:var(--bg)}
.rte-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.rte-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rte-btn .hl{background:var(--mark);padding:1px 5px;border-radius:3px;font-weight:700}
.rte-sep{width:1px;background:var(--line);margin:6px 4px}
.rte-area{min-height:220px;padding:14px 16px;outline:none;line-height:1.55;overflow-wrap:anywhere;font-size:15px}
.rte-area:empty::before{content:attr(data-placeholder);color:var(--muted);pointer-events:none}
.sheet.wide{width:min(780px,100%)}
.sheet.wide .rte-area{min-height:min(50vh,460px)}
.note-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.note-foot .acts{display:flex;gap:4px}
.chip.t-comprar{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.t-economizar{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.t-lembrete{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.sum-strip{display:flex;flex-wrap:wrap;gap:8px 22px}

/* editor */
.overlay{position:fixed;inset:0;background:rgb(10 12 18 / .45);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;box-sizing:border-box}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.sheet-actions>div{display:flex;gap:8px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13px}
textarea.export{width:100%;box-sizing:border-box;min-height:300px;font-family:var(--f-num);font-size:12.5px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}

/* salvar */
.savebar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;margin-bottom:env(safe-area-inset-bottom,0px)}
.savebar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
</style>
</head>
<body>
<div id="app"><p class="empty">Carregando suas contas…</p></div>

<script type="application/json" id="state">{"v":1,"ciclo":"","receitas":[],"contas":[],"cartoes":[],"conta":[],"guardado":[],"rendimento":0,"assinaturas":[],"parcelamentos":[],"notas":[],"categorias":[],"metas":{"gastoMax":null,"economia":null,"reserva":null,"cartaoDia":null}}</script>

<script id="main-script">
(function(){
"use strict";
const _unused = ":root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}";
const $app = document.getElementById("app");
const KEY = "contas-do-mes-v1";
let S = JSON.parse(document.getElementById("state").textContent);
try{ const saved = localStorage.getItem(KEY); if(saved) S = Object.assign(S, JSON.parse(saved)); }catch(_){}
if(!Array.isArray(S.assinaturas)) S.assinaturas = [];
if(!Array.isArray(S.parcelamentos)) S.parcelamentos = [];
if(!Array.isArray(S.notas)) S.notas = [];
if(!Array.isArray(S.categorias)) S.categorias = [];
let notaFiltro = "todas";
const TIPOS = {comprar:"Quero comprar", economizar:"Economizar", lembrete:"Lembrete", ideia:"Ideia"};
if(!S.metas || typeof S.metas!=="object") S.metas = {gastoMax:null, economia:null, reserva:null};
let view = "contas";
try{ const sv=sessionStorage.getItem("contas-view"); if(["geral","notas","limites"].includes(sv)) view=sv; }catch(_){}
const restante = p => Math.max(0,(p.parcelas||0)-(p.atual||0))*(Number(p.valor)||0);
let dirty = false, saving = false, saveMsg = "", modal = null, artifactApi = undefined;

const fmt = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const brl = v => fmt.format(Math.round((v||0)*100)/100);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dd = n => n==null?"—":String(n).padStart(2,"0");
const uid = p => p + Math.random().toString(36).slice(2,8);
function parseMoney(str){
  if(typeof str==="number") return str;
  let s = String(str||"").replace(/[R$\s]/g,"");
  if(!s) return NaN;
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  return Number(s);
}
const moneyIn = v => v==null||v===""?"":String(v.toFixed?v.toFixed(2):v).replace(".",",");

/* ---------- contas ---------- */
const sum = a => a.reduce((t,x)=>t+(Number(x.valor)||0),0);
function totals(){
  const entra = sum(S.receitas), sai = sum(S.contas);
  const res = entra - sai;
  const reserva = sum(S.conta) + sum(S.guardado);
  const pendente = sum(S.contas.filter(c=>!c.pago));
  return {entra, sai, res, reserva, comReserva: res + reserva, pendente};
}
function dayBlock(dia){
  const rec = S.receitas.filter(r=>r.dia===dia);
  const contas = S.contas.filter(c=>c.pagaCom===dia).sort((a,b)=>(b.atrasado?1:0)-(a.atrasado?1:0) || (a.dia??99)-(b.dia??99));
  const entra = sum(rec), sai = sum(contas);
  return {rec, contas, entra, sai, sobra: entra - sai, falta: sum(contas.filter(c=>!c.pago))};
}
const payDays = () => [...new Set(S.receitas.map(r=>r.dia))].sort((a,b)=>a-b);

function chipsFor(c){
  const out = [];
  if(c.atrasado) out.push('<span class="chip late">Atrasado</span>');
  if(c.estimado) out.push(`<span class="chip est">Estimado${c.min!=null&&c.max!=null?` · ${brl(c.min)}–${brl(c.max)}`:""}</span>`);
  if(c.tipo==="parcelado" && c.parcelas) out.push(`<span class="chip">Parcela ${Math.min((c.pagas||0)+1,c.parcelas)}/${c.parcelas}</span>`);
  if(c.tipo==="cartao") out.push('<span class="chip">Fatura</span>');
  return out.join("");
}
const check = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

/* ---------- render ---------- */
function render(){
  const t = totals();
  const days = payDays();
  // contas cujo dia de pagamento não tem recebimento
  const orphan = S.contas.filter(c=>!days.includes(c.pagaCom));
  let h = `
  <header class="top">
    <div class="brand">
      <button class="menu-btn" data-act="menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div>
        <h1>${VIEWS[view]}</h1>
        <div class="cycle"><label for="ciclo" class="label">Mês</label><input id="ciclo" value="${esc(S.ciclo)}" placeholder="ex.: Novembro"></div>
      </div>
    </div>
    <div class="actions">
      ${view==="contas"
        ? '<button class="btn" data-act="new">+ Nova conta</button><button class="btn" data-act="go-limites">Limites do mês</button><button class="btn" data-act="close">Fechar mês</button>'
        : `<button class="btn" data-act="go-contas">← Contas</button>${view==="geral"||view==="limites"?'<button class="btn" data-act="metas">Editar metas</button>':""}${view==="limites"?'<button class="btn" data-act="new-cat">+ Categoria</button>':""}`}
    </div>
  </header>
  ${drawerHTML()}`;
  if(view==="geral"){ h += overviewHTML(); finish(h); return; }
  if(view==="notas"){ h += notesHTML(); finish(h); return; }
  if(view==="limites"){ h += catsHTML(); finish(h); return; }
  h += `
  <section class="result" aria-label="Resumo do mês">
    <div><span class="label">Entra no mês</span><span class="v">${brl(t.entra)}</span><span class="sub">${days.map(d=>"dia "+dd(d)).join(" + ")}</span></div>
    <div><span class="label">Sai no mês</span><span class="v">${brl(t.sai)}</span><span class="sub">${brl(t.pendente)} ainda a pagar</span></div>
    <div><span class="label">${t.res>=0?"Sobra":"Falta"}</span><span class="v ${t.res>=0?"pos":"neg"}">${brl(Math.abs(t.res))}</span><span class="sub">só com o que entra</span></div>
    <div><span class="label">${t.comReserva>=0?"Sobra":"Falta"} usando saldos</span><span class="v ${t.comReserva>=0?"pos":"neg"}">${brl(Math.abs(t.comReserva))}</span><span class="sub">conta + guardado: ${brl(t.reserva)}</span></div>
  </section>

  <section class="days">`;
  if(!days.length){
    h += `<div class="panel" style="grid-column:1/-1"><h2>Comece pelos recebimentos</h2>
      <p class="note" style="margin:0">Cadastre os dias em que você recebe (salário, adiantamento, etc.). Cada recebimento vira um bloco "Pagar no dia" e você escolhe quais contas saem de cada um. Os seus dados ficam só neste aparelho.</p>
      <div><button class="btn primary" data-act="new-rec">+ Recebimento</button></div></div>`;
  }
  for(const d of days){
    const b = dayBlock(d);
    h += `<article class="day" aria-label="Pagamentos com o dinheiro do dia ${dd(d)}">
      <div class="day-head"><h2>Pagar no dia</h2><span class="big">${dd(d)}</span></div>
      ${b.rec.map(r=>`<div class="income"><button data-edit-rec="${r.id}"><span class="label">${esc(r.nome)}</span></button><span class="num">+ ${brl(r.valor)}</span></div>`).join("")}
      <ul class="list">${b.contas.length?b.contas.map(billRow).join(""):`<li class="empty">Nenhuma conta sai deste dinheiro.</li>`}</ul>
      <div class="day-foot"><div>${b.sobra>=0?"Sobra":"Falta"}<div class="left">${b.falta>0?brl(b.falta)+" pendente":"tudo pago"}</div></div><span class="num ${b.sobra>=0?"pos":"neg"}">${b.sobra>=0?"":"− "}${brl(Math.abs(b.sobra))}</span></div>
    </article>`;
  }
  h += `</section>`;
  if(orphan.length){
    h += `<section class="day"><div class="day-head"><h2>Sem dia de pagamento definido</h2></div><ul class="list">${orphan.map(billRow).join("")}</ul></section>`;
  }

  // assinaturas
  const subsTotal = sum(S.assinaturas);
  const semValor = S.assinaturas.filter(a=>a.valor==null).length;
  h += `<section class="lower"><div class="panel" aria-label="Assinaturas"><div class="panel-head"><div><h2>Assinaturas</h2>
      <div class="small">${S.assinaturas.length} ativa(s)${S.assinaturas.length?` · ${brl(subsTotal)}/mês${semValor?` (${semValor} sem valor)`:""}`:""} · já entram na fatura do cartão</div></div>
      <button class="btn ghost" data-act="new-sub">+ Assinatura</button></div>
    ${S.assinaturas.length?`<ul class="subs-list">${S.assinaturas.map(subRow).join("")}</ul>`:'<p class="note">Nenhuma assinatura cadastrada.</p>'}
  </div>`;

  // parcelados no cartão
  const parcMes = sum(S.parcelamentos), parcFut = S.parcelamentos.reduce((t,p)=>t+restante(p),0);
  h += `<div class="panel" aria-label="Parcelados no cartão"><div class="panel-head"><div><h2>Parcelados no cartão</h2>
      <div class="small">${S.parcelamentos.length?`${brl(parcMes)} nesta fatura · ${brl(parcFut)} nas próximas`:"compras parceladas que já entram na fatura"}</div></div>
      <button class="btn ghost" data-act="new-parc">+ Parcelado</button></div>
    ${S.parcelamentos.length?`<ul class="subs-list">${S.parcelamentos.map(parcRow).join("")}</ul>`:'<p class="note">Nenhuma compra parcelada cadastrada.</p>'}
  </div></section>`;

  // cartões
  h += `<section class="lower"><div class="panel"><div class="panel-head"><h2>Cartões</h2><button class="btn ghost" data-act="new-card">+ Cartão</button></div>`;
  if(!S.cartoes.length) h += `<p class="note">Nenhum cartão cadastrado.</p>`;
  for(const c of S.cartoes){
    const fatura = sum(S.contas.filter(x=>x.tipo==="cartao"&&x.cartao===c.id));
    const futuro = S.parcelamentos.filter(p=>p.cartao===c.id).reduce((t,p)=>t+restante(p),0);
    const pct = c.limite>0 ? Math.min(100, fatura/c.limite*100) : 0;
    const pctF = c.limite>0 ? Math.min(100-pct, futuro/c.limite*100) : 0;
    const usado = pct + pctF;
    h += `<div class="card-row"><div class="line"><button class="btn ghost" style="padding:0;color:var(--ink);font-weight:600" data-edit-card="${c.id}">${esc(c.nome)}</button><span class="num">${brl(fatura)} <span class="small">de ${brl(c.limite)}</span></span></div>
      <div class="bar" role="img" aria-label="${Math.round(usado)}% do limite comprometido"><i class="${usado>=80?"hot":""}" style="width:${pct.toFixed(1)}%"></i>${futuro>0?`<i class="future" style="width:${pctF.toFixed(1)}%"></i>`:""}</div>
      ${futuro>0?`<div class="legend small"><span>${brl(fatura)} na fatura</span><span class="f">${brl(futuro)} em parcelas futuras</span></div>`:""}
      <div class="line small"><span>${Math.round(usado)}% do limite ${futuro>0?"comprometido":"na fatura"}${(n=>n?` · ${n} assinatura${n>1?"s":""}`:"")(S.assinaturas.filter(a=>a.cartao===c.id).length)}</span><span class="num">${brl(Math.max(0,c.limite-fatura-futuro))} livre</span></div></div>`;
  }
  h += `</div>`;

  // saldos
  const sg = sum(S.guardado);
  h += `<div class="panel"><div class="panel-head"><h2>Saldos</h2><button class="btn ghost" data-act="new-saldo">+ Saldo</button></div>
    <div class="label group-label">Parado em conta</div><div class="rows">
    ${S.conta.map(s=>`<div class="row"><button data-edit-saldo="conta:${s.id}">${esc(s.nome)}</button><span class="num">${brl(s.valor)}</span></div>`).join("")||'<p class="note">Nada cadastrado.</p>'}
    </div>
    <div class="label group-label">Guardado</div><div class="rows">
    ${S.guardado.map(s=>`<div class="row"><button data-edit-saldo="guardado:${s.id}">${esc(s.nome)}${s.taxa?` <span class="small">${esc(s.taxa)}</span>`:""}</button><span class="num">${brl(s.valor)}</span></div>`).join("")}
    <div class="row total"><span>Total guardado</span><span class="num">${brl(sg)}</span></div>
    <div class="row"><button data-act="rend">Rendimento</button><span class="num pos">+ ${brl(S.rendimento)}</span></div>
    </div></div></section>`;

  finish(h);
}
function finish(h){
  if(saveMsg){
    h += `<div class="savebar" role="status"><span>${esc(saveMsg)}</span><button class="btn" data-act="backup">Backup</button></div>`;
  }
  $app.innerHTML = h;
  if(modal) renderModal();
}
/* ---------- dia a dia no cartão ---------- */
function cartaoDiaADia(){
  const faturas = sum(S.contas.filter(c=>c.tipo==="cartao"));
  const fixosCartao = sum(S.assinaturas.filter(a=>a.cartao && a.valor!=null)) + sum(S.parcelamentos.filter(p=>p.cartao));
  return {faturas, fixosCartao, variavel: Math.max(0, faturas - fixosCartao)};
}

/* ---------- limites por categoria ---------- */
function catsHTML(){
  const M = S.metas, dd2 = cartaoDiaADia();
  const tetoBloco = M.cartaoDia!=null ? (()=>{ const p=M.cartaoDia>0?dd2.variavel/M.cartaoDia*100:0; const st=p<=90?"good":p<=100?"warn":"bad";
    return `<div class="panel"><div class="panel-head"><div><h2>Dia a dia nos cartões</h2><div class="small">faturas menos assinaturas e parcelas</div></div><span class="pill st-${st}">${st==="bad"?"Acima":"Dentro"}</span></div>
      <div class="cat-big"><span class="v ${st==="bad"?"neg":""}">${brl(dd2.variavel)}</span><span class="small num">de ${brl(M.cartaoDia)}</span></div>
      ${meter(p,st)}
      <div class="line small" style="display:flex;justify-content:space-between;gap:10px"><span>${st==="bad"?brl(dd2.variavel-M.cartaoDia)+" acima do teto":brl(M.cartaoDia-dd2.variavel)+" de folga"}</span><span class="num">faturas ${brl(dd2.faturas)} − fixos ${brl(dd2.fixosCartao)}</span></div>
    </div>`; })() : "";
  return `<section aria-label="Limites do mês" style="display:grid;gap:14px">
    <p class="small" style="margin:0">Anote aqui os gastos de delivery, jogos e outras categorias para ver quanto ainda pode gastar. Os gastos zeram quando você fecha o mês.</p>
    <div class="cats">${tetoBloco}${S.categorias.map(catCard).join("")}</div>
  </section>`;
}
function catCard(c){
  const gasto = sum(c.gastos||[]); const p = c.limite>0 ? gasto/c.limite*100 : 0;
  const st = p<=80?"good":p<=100?"warn":"bad";
  const lista = (c.gastos||[]).slice().reverse();
  return `<div class="panel" aria-label="${esc(c.nome)}">
    <div class="panel-head"><button class="btn ghost" style="padding:0;color:var(--ink)" data-cat-edit="${c.id}"><h2>${esc(c.nome)}</h2></button><span class="pill st-${st}">${st==="bad"?"Estourou":st==="warn"?"Quase no limite":"Dentro"}</span></div>
    <div class="cat-big"><span class="v ${st==="bad"?"neg":""}">${brl(gasto)}</span><span class="small num">de ${brl(c.limite)}</span></div>
    ${meter(p,st)}
    <div class="small">${gasto<=c.limite?`Ainda pode gastar <strong class="num">${brl(c.limite-gasto)}</strong> este mês`:`Passou <strong class="num">${brl(gasto-c.limite)}</strong> do limite`}</div>
    <div class="cat-add">
      <input id="cv-${c.id}" inputmode="decimal" placeholder="R$ 0,00" aria-label="Valor do gasto em ${esc(c.nome)}">
      <input id="cd-${c.id}" placeholder="o que foi (opcional)" aria-label="Descrição do gasto">
      <button class="btn" data-cat-add="${c.id}">Anotar</button>
    </div>
    <p class="err" id="ce-${c.id}" hidden></p>
    ${lista.length?`<ul class="gastos">${lista.map(g=>`<li><span>${esc(g.desc||"Gasto")} <span class="small">· ${esc(g.data||"")}</span></span><span class="num">${brl(g.valor)}</span><button class="x" data-cat-del="${c.id}:${g.id}" aria-label="Remover gasto">×</button></li>`).join("")}</ul>`:'<p class="note" style="margin:0">Nenhum gasto anotado este mês.</p>'}
  </div>`;
}
function catAdd(id){
  const c = S.categorias.find(x=>x.id===id); const vi = document.getElementById("cv-"+id), di = document.getElementById("cd-"+id), err = document.getElementById("ce-"+id);
  const v = parseMoney(vi.value);
  if(!isFinite(v) || v<=0){ err.textContent="Digite o valor, por exemplo 45,90."; err.hidden=false; vi.focus(); return; }
  c.gastos = c.gastos||[]; c.gastos.push({id:uid("g"), valor:v, desc:di.value.trim(), data:hojeBR().slice(0,5)});
  change();
  const again = document.getElementById("cv-"+id); if(again) again.focus();
}
function catEditor(id){
  const isNew = !id; const c = isNew ? {nome:"",limite:null} : S.categorias.find(x=>x.id===id);
  simpleEditor({title: isNew?"Nova categoria":"Editar categoria", fields:[
    {id:"k-cnome",key:"nome",label:"Nome",value:c.nome,required:true,ph:"ex.: Roupas"},
    {id:"k-clim",key:"limite",label:"Limite por mês (R$)",value:c.limite,money:true}],
    onSave: v => { if(isNew) S.categorias.push({id:uid("cat"),...v,gastos:[]}); else Object.assign(c,v); },
    onDelete: isNew ? null : () => { S.categorias = S.categorias.filter(x=>x.id!==id); }});
}

/* ---------- visão geral ---------- */
function statusOf(v, okMax, warnMax){ return v<=okMax?"good":v<=warnMax?"warn":"bad"; }
const ST_LABEL = {good:"Tranquilo", warn:"Atenção", bad:"Crítico", none:"Sem meta"};
const pctTxt = v => (isFinite(v)?Math.round(v):0) + "%";
function meter(pct, st, tickPct){
  const w = Math.max(0,Math.min(100,pct));
  return `<div class="tick-wrap"><div class="bar"><i class="${st}" style="width:${w.toFixed(1)}%"></i></div>${tickPct!=null?`<span class="tick" style="left:calc(${Math.min(100,tickPct)}% - 1px)" aria-hidden="true"></span>`:""}</div>`;
}
function overviewHTML(){
  if(!S.receitas.length && !S.contas.length) return `<div class="panel"><h2>Ainda não há dados</h2><p class="note" style="margin:0">Cadastre seus recebimentos e contas para ver a visão geral.</p><div><button class="btn" data-act="go-contas">Ir para Contas</button></div></div>`;
  const t = totals();
  const renda = t.entra || 0;
  // contas x renda
  const contasPct = renda>0 ? t.sai/renda*100 : 0;
  const stContas = statusOf(contasPct, 85, 100);
  // dívidas
  const emprest = S.contas.filter(c=>c.tipo==="parcelado"&&c.parcelas);
  const emprestRest = emprest.reduce((s,c)=>s+Math.max(0,c.parcelas-(c.pagas||0))*c.valor,0);
  const faturas = sum(S.contas.filter(c=>c.tipo==="cartao"));
  const parcFut = S.parcelamentos.reduce((s,p)=>s+restante(p),0);
  const dividaTotal = emprestRest + faturas + parcFut;
  const parcelasMes = sum(emprest) + sum(S.parcelamentos);
  const parcPct = renda>0 ? parcelasMes/renda*100 : 0;
  const stParc = statusOf(parcPct, 30, 40);
  const mesesRenda = renda>0 ? dividaTotal/renda : 0;
  // cartões
  const limTotal = S.cartoes.reduce((s,c)=>s+(Number(c.limite)||0),0);
  const cardPct = limTotal>0 ? (faturas+parcFut)/limTotal*100 : 0;
  const stCard = statusOf(cardPct, 50, 80);
  // reserva
  const reserva = t.reserva;
  const coberturaMeses = t.sai>0 ? reserva/t.sai : 0;
  const rendPct = sum(S.guardado)>0 ? (Number(S.rendimento)||0)/sum(S.guardado)*100 : 0;
  // endividado?
  const endividado = t.res < 0 || cardPct > 80 || parcPct > 40;
  const stGeral = (t.comReserva < 0 || contasPct > 100) ? "bad" : (endividado || stContas!=="good" || stParc!=="good") ? "warn" : "good";
  const frase = stGeral==="bad"
    ? `As contas deste mês passam do que você recebe em ${brl(Math.abs(t.res))}${t.comReserva<0?`, e mesmo usando os saldos ainda faltam ${brl(Math.abs(t.comReserva))}`:`. Os saldos cobrem a diferença, mas a reserva cai`}.`
    : stGeral==="warn" ? "As contas cabem na renda, mas algum indicador abaixo está perto do limite." : "As contas cabem na renda e os indicadores estão em faixa tranquila.";

  // metas
  const M = S.metas;
  const metaRows = [];
  if(M.gastoMax!=null){ const p=M.gastoMax>0?t.sai/M.gastoMax*100:0; const st=p<=100?(p<=90?"good":"warn"):"bad";
    metaRows.push(`<div class="meter"><div class="line"><span>Gastos do mês</span><span class="pill st-${st}">${st==="bad"?"Acima":"Dentro"}</span></div>${meter(p,st)}<div class="line small"><span class="num">${brl(t.sai)} de ${brl(M.gastoMax)}</span><span>${st==="bad"?brl(t.sai-M.gastoMax)+" acima":brl(M.gastoMax-t.sai)+" de folga"}</span></div></div>`); }
  if(M.economia!=null){ const sob=Math.max(0,t.res); const p=M.economia>0?sob/M.economia*100:100; const st=p>=100?"good":p>=50?"warn":"bad";
    metaRows.push(`<div class="meter"><div class="line"><span>Guardar por mês</span><span class="pill st-${st}">${st==="good"?"Atingível":st==="warn"?"Parcial":"Fora"}</span></div>${meter(p,st)}<div class="line small"><span class="num">sobra ${brl(t.res)} · meta ${brl(M.economia)}</span><span>${t.res>=M.economia?"dá para guardar a meta":"faltam "+brl(M.economia-Math.max(0,t.res))}</span></div></div>`); }
  if(M.reserva!=null){ const p=M.reserva>0?reserva/M.reserva*100:0; const st=p>=100?"good":p>=50?"warn":"bad";
    metaRows.push(`<div class="meter"><div class="line"><span>Reserva guardada</span><span class="pill st-${st}">${pctTxt(p)}</span></div>${meter(p,st)}<div class="line small"><span class="num">${brl(reserva)} de ${brl(M.reserva)}</span><span>${p>=100?"meta alcançada":"faltam "+brl(M.reserva-reserva)}</span></div></div>`); }

  if(M.cartaoDia!=null){ const dd2=cartaoDiaADia(); const p=M.cartaoDia>0?dd2.variavel/M.cartaoDia*100:0; const st=p<=90?"good":p<=100?"warn":"bad";

function notaHTML(n){ return n.html ? sanitizeNote(n.html) : esc(n.texto||"").replace(/\n/g,"<br>"); }
function sanitizeNote(html){
  const tpl = document.createElement("template"); tpl.innerHTML = html||"";
  const MAP = {B:"b",STRONG:"b",I:"i",EM:"i",U:"u",S:"s",STRIKE:"s",DEL:"s",MARK:"mark",UL:"ul",OL:"ol",LI:"li",DIV:"div",P:"div"};
  const walk = node => {
    let out = "";
    node.childNodes.forEach(c => {
      if(c.nodeType===3){ out += esc(c.nodeValue); return; }
      if(c.nodeType!==1) return;
      const tag = c.tagName;
      if(["SCRIPT","STYLE","TEMPLATE","IFRAME","OBJECT"].includes(tag)) return;
      if(tag==="BR"){ out += "<br>"; return; }
      let inner = walk(c);
      const st = (c.getAttribute && c.getAttribute("style")||"").toLowerCase();
      const wrap = t => inner = `<${t}>${inner}</${t}>`;
      if(/background(-color)?\s*:/.test(st) && !/transparent|initial|inherit/.test(st.split(/background(?:-color)?\s*:/)[1]||"")) wrap("mark");
      if(/font-weight\s*:\s*(bold|[6-9]00)/.test(st)) wrap("b");
      if(/font-style\s*:\s*italic/.test(st)) wrap("i");
      if(/text-decoration[^;]*underline/.test(st)) wrap("u");
      if(/text-decoration[^;]*line-through/.test(st)) wrap("s");
      out += MAP[tag] ? `<${MAP[tag]}>${inner}</${MAP[tag]}>` : inner;
    });
    return out;
  };
  return walk(tpl.content).slice(0, 60000);
}
function htmlToText(html){
  const tpl = document.createElement("template"); tpl.innerHTML = html||"";
  let out = "";
  const walk = node => node.childNodes.forEach(c => {
    if(c.nodeType===3){ out += c.nodeValue; return; }
    if(c.nodeType!==1) return;
    if(c.tagName==="BR"){ out += "\n"; return; }
    if(c.tagName==="LI") out += (c.parentElement && c.parentElement.tagName==="OL" ? (Array.from(c.parentElement.children).indexOf(c)+1)+". " : "• ");
    walk(c);
    if(["DIV","LI","UL","OL"].includes(c.tagName) && !out.endsWith("\n")) out += "\n";
  });
  walk(tpl.content);
  return out.replace(/\n{3,}/g,"\n\n");
}
function placeCaretEnd(el){

}
function selectionIn(area){
  const s = getSelection(); if(!s || !s.rangeCount) return false;
  return area.contains(s.anchorNode);
}
function unwrap(el){ const p = el.parentNode; while(el.firstChild) p.insertBefore(el.firstChild, el); p.removeChild(el); }
function closestIn(area, sel){
  const s = getSelection(); if(!s || !s.rangeCount) return null;
  let n = s.anchorNode; n = n && (n.nodeType===1 ? n : n.parentElement);
  const m = n && n.closest(sel); return m && area.contains(m) ? m : null;
}
function rteCmd(cmd, area){
  if(!selectionIn(area)){ area.focus(); placeCaretEnd(area); }
  try{ document.execCommand("styleWithCSS", false, false); }catch(_){}
  if(cmd==="mark"){
    const m = closestIn(area, "mark");
    if(m){ unwrap(m); }
    else if(!getSelection().isCollapsed){
      try{ document.execCommand("styleWithCSS", false, true); }catch(_){}
      if(!document.execCommand("hiliteColor", false, "#fde68a")) document.execCommand("backColor", false, "#fde68a");
      try{ document.execCommand("styleWithCSS", false, false); }catch(_){}
      area.querySelectorAll("span[style], font[style]").forEach(sp => {
        if(/background/i.test(sp.getAttribute("style"))){ const mk = document.createElement("mark"); while(sp.firstChild) mk.appendChild(sp.firstChild); sp.replaceWith(mk); }
      });
    }
  } else if(cmd==="removeFormat"){
    document.execCommand("removeFormat");
    const s = getSelection();
    area.querySelectorAll("mark").forEach(mk => { if(s.containsNode && s.containsNode(mk, true)) unwrap(mk); });
  } else {
    document.execCommand(cmd, false, null);
  }
  if(area.id==="nt-area") notaDraft = area.innerHTML;
  updateRteBars();
}
function updateRteBars(){

    let on = false;

      if(b.dataset.rte==="mark") on = !!closestIn(area, "mark");

  bind(o){

    g("s-ok").onclick = () => {
      const vals = {};
      for(const f of fields){
        const raw = g(f.id).value.trim();
        if(f.money){ const n=parseMoney(raw); if(!isFinite(n)){ const e=g("s-err"); e.textContent=`Confira o campo "${f.label}" (ex.: 536,05).`; e.hidden=false; return; } vals[f.key]=n; }
        else if(f.int){ const n=parseInt(raw,10); if(!(n>=1&&n<=31)){ const e=g("s-err"); e.textContent="O dia precisa estar entre 1 e 31."; e.hidden=false; return; } vals[f.key]=n; }
        else { if(f.required && !raw){ const e=g("s-err"); e.textContent=`Preencha "${f.label}".`; e.hidden=false; return; } vals[f.key]=raw; }
      }
      onSave(vals); change(); closeModal();
    };
  }});
}

function exportText(){
  const L = [], sep = "-".repeat(88);
  const days = payDays();
  for(const r of S.receitas) L.push(`Á Receber dia ${dd(r.dia)} do mês - ${brl(r.valor).replace(/\s/g,"")}`, "");
  L.push(`Total à receber no mês = ${brl(sum(S.receitas)).replace(/\s/g,"")}`, "", sep, "");
  const grupos = [...new Set(S.contas.map(c=>c.grupo||"Outros"))];
  for(const gname of grupos){
    L.push(`${gname.toUpperCase()} -->`, "");
    for(const c of S.contas.filter(x=>(x.grupo||"Outros")===gname)){
      let s = `\t${c.nome.toUpperCase()}`;
      if(c.tipo==="cartao"){ const card=S.cartoes.find(k=>k.id===c.cartao); if(card) s += `(LIM.= ${brl(card.limite).replace(/\s/g,"")})`; }
      if(c.tipo==="parcelado"&&c.parcelas) s += ` ${(c.pagas||0)+1}/${c.parcelas}`;
      s += ` = ${brl(c.valor).replace(/\s/g,"")}`;
      if(c.estimado&&c.min!=null&&c.max!=null) s += ` ?(${brl(c.min).replace(/\s/g,"")}-${brl(c.max).replace(/\s/g,"")})`;
      if(c.atrasado) s += "(ATRASADO)";
      if(c.dia) s += ` -> vence ${dd(c.dia)}`;
      s += ` -> paga com dia ${dd(c.pagaCom)}${c.pago?" [PAGO]":""}`;
      L.push(s, "");
    }
  }
  for(const d of days) L.push(`\tTOTAL DIA ${dd(d)} = ${brl(dayBlock(d).sai).replace(/\s/g,"")}`);
  if(S.assinaturas.length){
    L.push("", sep, "ASSINATURAS -->", "");
    for(const a of S.assinaturas){ const card=S.cartoes.find(k=>k.id===a.cartao); L.push(`\t${a.nome.toUpperCase()}${a.valor!=null?" = "+brl(a.valor).replace(/\s/g,""):""} -> ${card?"CARTÃO "+card.nome.toUpperCase():"CARTÃO ?"}${a.dia?" (dia "+dd(a.dia)+")":""}`); }
  }
  if(S.parcelamentos.length){
    L.push("", sep, "PARCELADOS NO CARTÃO -->", "");
    for(const p of S.parcelamentos){ const card=S.cartoes.find(k=>k.id===p.cartao); L.push(`\t${p.nome.toUpperCase()} ${p.parcelas}x${brl(p.valor).replace(/\s/g,"")}/${p.atual}ªparc. -> ${card?"CARTÃO "+card.nome.toUpperCase():"CARTÃO ?"}${p.data?" (compra "+p.data+")":""}`); }
  }
  const abertas = S.notas.filter(n=>!n.feito);
  if(abertas.length){
    L.push("", sep, "NOTAS -->", "");
    for(const n of abertas) L.push(`\t[${(TIPOS[n.tipo]||"Nota").toUpperCase()}] ${n.texto.replace(/\n+/g," / ")}${n.valor!=null?" = "+brl(n.valor).replace(/\s/g,""):""}`);
  }
  L.push("", sep, "PARADO EM CONTA -->", "");
  for(const s of S.conta) L.push(`\t${s.nome.toUpperCase()} = ${brl(s.valor).replace(/\s/g,"")}`);
  L.push("", "", "GUARDADO -->", "");
  for(const s of S.guardado) L.push(`\t${s.nome.toUpperCase()}${s.taxa?" "+s.taxa:""} = ${brl(s.valor).replace(/\s/g,"")}`);
  L.push("", `\tTOTAL GUARDADO = ${brl(sum(S.guardado)).replace(/\s/g,"")}`, "", `\tRENDIMENTO = ${brl(S.rendimento).replace(/\s/g,"")}`);
  return L.join("\n");
}

function closeMonth(){
  const t = totals();
  const pend = S.contas.filter(c=>!c.pago);
  openModal({noFocus:true, html:()=>`<h2>Fechar ${esc(S.ciclo||"o mês")}</h2>
    <p class="note">Isso prepara a lista para o próximo mês:</p>
    <ul class="note" style="margin:0;padding-left:18px;display:grid;gap:4px">
      <li>contas fixas e faturas voltam como pendentes (faturas ficam com o valor do mês passado até você atualizar);</li>
      <li>parceladas pagas avançam uma parcela e somem quando terminam;</li>
      <li>compras parceladas no cartão avançam uma parcela e saem da lista depois da última;</li>
      <li>contas marcadas “só este mês” que já foram pagas saem da lista;</li>
      <li>os gastos anotados nos limites do mês são zerados (os limites continuam);</li>
      <li>as notas continuam como estão.</li></ul>
    ${pend.length?`<p class="err">${pend.length} conta(s) ainda não marcada(s) como paga(s) (${brl(sum(pend))}). Elas continuam na lista e ficam marcadas como atrasadas.</p>`:""}
    <div class="field"><label for="m-ciclo">Nome do próximo mês</label><input id="m-ciclo" placeholder="ex.: Dezembro"></div>
    <div class="sheet-actions"><div></div><div><button class="btn" id="m-cancel">Cancelar</button><button class="btn primary" id="m-ok">Fechar mês</button></div></div>`,
  bind(o){
    o.querySelector("#m-cancel").onclick = closeModal;
    o.querySelector("#m-ok").onclick = () => {
      const next = [];
      for(const c of S.contas){
        if(!c.pago){ next.push({...c, atrasado:true}); continue; }
        if(c.tipo==="avulsa") continue;
        if(c.tipo==="parcelado"){ const pagas=(c.pagas||0)+1; if(c.parcelas && pagas>=c.parcelas) continue; next.push({...c,pagas,pago:false,atrasado:false}); continue; }
        next.push({...c, pago:false, atrasado:false});
      }
      S.contas = next;
      S.categorias = S.categorias.map(c=>({...c, gastos:[]}));
      S.parcelamentos = S.parcelamentos.filter(p=>(p.atual||0) < (p.parcelas||0)).map(p=>({...p, atual:(p.atual||0)+1}));
      S.ciclo = o.querySelector("#m-ciclo").value.trim() || S.ciclo;
      change(); closeModal();
    };
  }});
}

/* ---------- eventos ---------- */
$app.addEventListener("click", e => {
  if(e.target.classList && e.target.classList.contains("drawer-ov")){ setMenu(false); return; }
  const el = e.target.closest("button"); if(!el) return;
  if(el.dataset.toggle){ const c=S.contas.find(x=>x.id===el.dataset.toggle); c.pago=!c.pago; change(); return; }
  if(el.dataset.edit){ billEditor(el.dataset.edit); return; }
  if(el.dataset.editSub){ subEditor(el.dataset.editSub); return; }
  if(el.dataset.editParc){ parcEditor(el.dataset.editParc); return; }
  if(el.dataset.catAdd){ catAdd(el.dataset.catAdd); return; }
  if(el.dataset.catEdit){ catEditor(el.dataset.catEdit); return; }
  if(el.dataset.catDel){ const [cid,gid]=el.dataset.catDel.split(":"); const c=S.categorias.find(x=>x.id===cid); c.gastos=c.gastos.filter(g=>g.id!==gid); change(); return; }
  if(el.dataset.filtro){ notaFiltro = el.dataset.filtro; render(); return; }
  if(el.dataset.notaEdit){ notaEditor(el.dataset.notaEdit); return; }
  if(el.dataset.notaFeito){ const n=S.notas.find(x=>x.id===el.dataset.notaFeito); n.feito=!n.feito; change(); return; }
  if(el.dataset.editRec){
    const r = S.receitas.find(x=>x.id===el.dataset.editRec);
    simpleEditor({title:"Recebimento", fields:[
      {id:"r-nome",key:"nome",label:"Nome",value:r.nome,required:true},
      {id:"r-dia",key:"dia",label:"Dia que cai",value:r.dia,int:true},
      {id:"r-val",key:"valor",label:"Valor (R$)",value:r.valor,money:true}],
      onSave:v=>{ const old=r.dia; Object.assign(r,v); if(old!==r.dia) S.contas.forEach(c=>{ if(c.pagaCom===old) c.pagaCom=r.dia; }); },
      onDelete: S.receitas.length>1 ? ()=>{ S.receitas=S.receitas.filter(x=>x!==r); } : null});
    return;
  }
  if(el.dataset.editCard){
    const c = S.cartoes.find(x=>x.id===el.dataset.editCard);
    simpleEditor({title:"Cartão", fields:[{id:"k-nome",key:"nome",label:"Nome",value:c.nome,required:true},{id:"k-lim",key:"limite",label:"Limite (R$)",value:c.limite,money:true}],
      onSave:v=>Object.assign(c,v), onDelete:()=>{ S.cartoes=S.cartoes.filter(x=>x!==c); S.assinaturas.forEach(a=>{ if(a.cartao===c.id) a.cartao=""; }); S.parcelamentos.forEach(a=>{ if(a.cartao===c.id) a.cartao=""; }); }});
    return;
  }
  if(el.dataset.editSaldo){
    const [kind,id] = el.dataset.editSaldo.split(":"); const s = S[kind].find(x=>x.id===id);
    const fields=[{id:"x-nome",key:"nome",label:"Nome",value:s.nome,required:true}];
    if(kind==="guardado") fields.push({id:"x-taxa",key:"taxa",label:"Rendimento (ex.: 121% CDI)",value:s.taxa||""});
    fields.push({id:"x-val",key:"valor",label:"Saldo (R$)",value:s.valor,money:true});
    simpleEditor({title: kind==="conta"?"Saldo em conta":"Guardado", fields, onSave:v=>Object.assign(s,v), onDelete:()=>{ S[kind]=S[kind].filter(x=>x!==s); }});
    return;
  }
  switch(el.dataset.act){
    case "new": if(!payDays().length){ recEditor(); break; } billEditor(null); break;
    case "new-rec": setMenu(false); recEditor(); break;
    case "go-contas": case "go-geral": case "go-limites": case "go-notas":
      view = el.dataset.act.slice(3);
      try{ sessionStorage.setItem("contas-view", view); }catch(_){} render(); window.scrollTo(0,0); break;
    case "menu": setMenu(true); break;
    case "menu-close": setMenu(false); break;
    case "backup": setMenu(false); backupDialog(); break;
    case "add-nota": addNota(); break;
    case "new-cat": catEditor(null); break;
    case "metas": metasEditor(); break;
    case "new-sub": subEditor(null); break;
    case "new-parc": parcEditor(null); break;
    case "new-card": simpleEditor({title:"Novo cartão", fields:[{id:"k-nome",key:"nome",label:"Nome",value:"",required:true,ph:"ex.: Nubank"},{id:"k-lim",key:"limite",label:"Limite (R$)",value:"",money:true}], onSave:v=>S.cartoes.push({id:uid("k"),...v})}); break;
    case "new-saldo":
      openModal({html:()=>`<h2>Novo saldo</h2><div class="field"><label for="n-kind">Onde está</label><select id="n-kind"><option value="conta">Parado em conta</option><option value="guardado">Guardado (rendendo)</option></select></div>
        <div class="sheet-actions"><div></div><div><button class="btn" id="n-cancel">Cancelar</button><button class="btn primary" id="n-ok">Continuar</button></div></div>`,
        bind(o){ o.querySelector("#n-cancel").onclick=closeModal; o.querySelector("#n-ok").onclick=()=>{ const k=o.querySelector("#n-kind").value;
          const fields=[{id:"x-nome",key:"nome",label:"Nome",value:"",required:true,ph:"ex.: Nubank · caixinha"}];
          if(k==="guardado") fields.push({id:"x-taxa",key:"taxa",label:"Rendimento (ex.: 100% CDI)",value:""});
          fields.push({id:"x-val",key:"valor",label:"Saldo (R$)",value:"",money:true});
          simpleEditor({title:"Novo saldo",fields,onSave:v=>S[k].push({id:uid("s"),...v})}); }; }});
      break;
    case "rend": simpleEditor({title:"Rendimento do mês", fields:[{id:"y-val",key:"rendimento",label:"Valor (R$)",value:S.rendimento,money:true}], onSave:v=>{S.rendimento=v.rendimento;}}); break;
    case "export":
      setMenu(false);
      openModal({noFocus:true, html:()=>`<h2>Formato do bloco de notas</h2><textarea class="export" id="e-txt" readonly>${esc(exportText())}</textarea>
        <p class="note" id="e-msg">Copie e cole no seu arquivo de texto.</p>
        <div class="sheet-actions"><div></div><div><button class="btn" id="e-close">Fechar</button><button class="btn primary" id="e-copy">Copiar</button></div></div>`,
        bind(o){ o.querySelector("#e-close").onclick=closeModal; o.querySelector("#e-copy").onclick=()=>{ const ta=o.querySelector("#e-txt"), msg=o.querySelector("#e-msg");
          const fallback=()=>{ ta.focus(); ta.select(); msg.textContent="Texto selecionado. Use Ctrl+C para copiar."; };
          try{ navigator.clipboard.writeText(ta.value).then(()=>{ msg.textContent="Copiado."; }, fallback); }catch(_){ fallback(); } }; }});
      break;
    case "close": closeMonth(); break;
  }
});
$app.addEventListener("input", e => { if(e.target.id==="ciclo"){ S.ciclo = e.target.value; persist(); } });
document.addEventListener("keydown", e => {
  if(e.key==="Escape"){ if(modal) closeModal(); else setMenu(false); }
  if(e.key==="Enter" && e.target.id && /^c[vd]-/.test(e.target.id)){ e.preventDefault(); catAdd(e.target.id.slice(3)); }
});

function renderSaveBarOnly(){
  // evita re-render completo enquanto digita o nome do mês
  if(!document.querySelector(".savebar")){ const pos = document.activeElement && document.activeElement.id; render(); if(pos){ const el=document.getElementById(pos); if(el){ el.focus(); const n=el.value.length; try{el.setSelectionRange(n,n);}catch(_){}} } }
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); saveMsg = ""; }
  catch(_){ saveMsg = "Este navegador não deixou salvar. Use Backup > Exportar para não perder os dados."; }
}
function change(){ persist(); render(); }

render();
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
</script>
